<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Driftly</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2308080c'/%3E%3Cpath d='M16 14 L31 48 L34 35 L47 32 Z' fill='%237c5cff'/%3E%3C/svg%3E">
<style>
  :root{--bg:#08080c;--text:#f2f2f8;--muted:#9b9bad;--accent:#7c5cff;--teal:#2dd4bf}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);
    color:var(--text);font-family:Inter,system-ui,sans-serif;text-align:center;padding:24px}
  .box h1{font-size:5rem;font-weight:700;background:linear-gradient(120deg,var(--accent),var(--teal));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .box p{color:var(--muted);margin:14px 0 26px;line-height:1.6}
  .box a{display:inline-block;margin:0 6px;padding:12px 22px;border-radius:12px;text-decoration:none;
    color:var(--text);border:1px solid rgba(255,255,255,.14)}
  .box a.primary{background:linear-gradient(120deg,var(--accent),var(--teal));border:none;color:#0a0a12;font-weight:600}
</style>
</head>
<body>
<div class="box">
  <h1>404</h1>
  <p>Такой страницы нет — возможно, ссылка устарела.<br>There is no such page — the link may be outdated.</p>
  <a class="primary" href="/">На главную · Home</a>
  <a href="/app/">Открыть приложение · Open the app</a>
</div>
</body>
</html>
